[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=1

[Metadata]
Name=MyEffects
Author=MyEffects
Information=Selector de temas (SignalRGB)
Version=2.0

[Variables]
; ruta de la herramienta (motor, lanzadores) escrita por Iniciar.vbs del paquete portable
@Include=#@#Rutas.inc
Font=Segoe UI
Bg=30,34,42,200
Tx=242,242,242
Sub=158,168,184
Abierto=0

; temporizador para tooltips con retardo (plugin incluido con Rainmeter)
[mTimerAzar]
Measure=Plugin
Plugin=ActionTimer
ActionList1=Wait 600 | MostrarTipTipAzar
MostrarTipTipAzar=[!SetOption mBtnAzar ToolTipHidden 0][!UpdateMeter mBtnAzar][!Redraw]
DynamicVariables=1

[mTimerRotar]
Measure=Plugin
Plugin=ActionTimer
ActionList1=Wait 600 | MostrarTipTipRotar
MostrarTipTipRotar=[!SetOption mBtnRotar ToolTipHidden 0][!UpdateMeter mBtnRotar][!Redraw]
DynamicVariables=1

[mTimerRefresh]
Measure=Plugin
Plugin=ActionTimer
ActionList1=Wait 600 | MostrarTipTipRefresh
MostrarTipTipRefresh=[!SetOption mCabAdd ToolTipHidden 0][!UpdateMeter mCabAdd][!Redraw]
DynamicVariables=1

[mTimerPrev]
Measure=Plugin
Plugin=ActionTimer
ActionList1=Wait 600 | MostrarTipTipPrev
MostrarTipTipPrev=[!SetOption mBtnPrev ToolTipHidden 0][!UpdateMeter mBtnPrev][!Redraw]
DynamicVariables=1

[mTimerNext]
Measure=Plugin
Plugin=ActionTimer
ActionList1=Wait 600 | MostrarTipTipNext
MostrarTipTipNext=[!SetOption mBtnNext ToolTipHidden 0][!UpdateMeter mBtnNext][!Redraw]
DynamicVariables=1


; ---------- medidas ----------
[mTema]
Measure=Registry
RegHKey=HKEY_CURRENT_USER
RegKey=Software\TemasRGB
RegValue=Tema
; nombres largos: corta a 12 caracteres y agrega puntos suspensivos
RegexSubstitute="^(.{12}).+$":"\1..."

; numero de temas (para el alto del panel desplegado)
[mNTemas]
Measure=Registry
RegHKey=HKEY_CURRENT_USER
RegKey=Software\TemasRGB
RegValue=NTemas

; intervalo de rotacion: 0=NO, 30, 60, 180, 360, 720 minutos
; etiqueta de rotacion ya formada por el motor (ej. "30 m")
[mRot]
Measure=Registry
RegHKey=HKEY_CURRENT_USER
RegKey=Software\TemasRGB
RegValue=RotacionTxt

; color del reloj segun si la rotacion esta activa (violeta) o no (blanco)
[mColorRot]
Measure=Registry
RegHKey=HKEY_CURRENT_USER
RegKey=Software\TemasRGB
RegValue=RotacionColor

; progreso de la rotacion para la barra superior (0-100; 100 = NO/completa)
[mRotProg]
Measure=Registry
RegHKey=HKEY_CURRENT_USER
RegKey=Software\TemasRGB
RegValue=RotacionProg

; minutos que faltan para el proximo cambio automatico (-1 = rotacion en NO)
[mRotResta]
Measure=Registry
RegHKey=HKEY_CURRENT_USER
RegKey=Software\TemasRGB
RegValue=RotacionResta

; el alto del panel se ajusta al numero de temas; las filas se
; muestran/ocultan solas con su formula Hidden (se evalua cada segundo)

; filas de la lista: cada una aplica ese tema
[mSig]
Measure=Registry
RegHKey=HKEY_CURRENT_USER
RegKey=Software\TemasRGB
RegValue=SiguienteCiclo

[mActivo]
Measure=Registry
RegHKey=HKEY_CURRENT_USER
RegKey=Software\TemasRGB
RegValue=Activo

[mL1]
Measure=Registry
RegHKey=HKEY_CURRENT_USER
RegKey=Software\TemasRGB
RegValue=T1
Substitute="^0$":""

[mL2]
Measure=Registry
RegHKey=HKEY_CURRENT_USER
RegKey=Software\TemasRGB
RegValue=T2
Substitute="^0$":""

[mL3]
Measure=Registry
RegHKey=HKEY_CURRENT_USER
RegKey=Software\TemasRGB
RegValue=T3
Substitute="^0$":""

[mL4]
Measure=Registry
RegHKey=HKEY_CURRENT_USER
RegKey=Software\TemasRGB
RegValue=T4
Substitute="^0$":""

[mL5]
Measure=Registry
RegHKey=HKEY_CURRENT_USER
RegKey=Software\TemasRGB
RegValue=T5
Substitute="^0$":""

[mL6]
