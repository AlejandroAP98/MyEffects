Substitute="^0$":""

[mL8]
Measure=Registry
RegHKey=HKEY_CURRENT_USER
RegKey=Software\TemasRGB
RegValue=T8
Substitute="^0$":""

; ---------- visual ----------
[mFondo]
Meter=Shape
DynamicVariables=1
Shape=Rectangle 0,0,180,50 | Fill Color #Bg# | StrokeWidth 0
Shape2=Rectangle 0,0,([mRotProg] * 0.6),1 | Fill Color 255,70,70 | StrokeWidth 0
Shape3=Rectangle ([mRotProg] * 0.6),0,([mRotProg] * 0.6),1 | Fill Color 70,255,120 | StrokeWidth 0
Shape4=Rectangle ([mRotProg] * 1.2),0,([mRotProg] * 0.6),1 | Fill Color 70,140,255 | StrokeWidth 0

; zona invisible de cierre (bajo todo lo demas, solo activa con la lista abierta)
[mZonaCerrar]
Meter=Shape
X=0
Y=3
W=180
H=460
Shape=Rectangle 0,0,180,460,10,10 | Fill Color 0,0,0,1 | StrokeWidth 0
Hidden=1
ToolTipText=Ocultar lista de temas
LeftMouseUpAction=[!HideMeter mZonaCerrar][!SetVariable Abierto 0][!HideMeterGroup Lista][!ShowMeter mZonaAbrir][!ShowMeter mSigTxt][!SetOption mFondo Shape "Rectangle 0,0,180,50 | Fill Color #Bg# | StrokeWidth 0"][!UpdateMeter mFondo][!ShowMeter mChevron][!Redraw]

; tema centrado entre los dos botones
[mTemaTxt]
Meter=String
MeasureName=mTema
X=90
Y=27
W=120
H=24
ClipString=1
StringAlign=CenterCenter
FontFace=#Font#
FontStyle=Bold
FontSize=15
FontColor=#Tx#
AntiAlias=1
DynamicVariables=1
Text=%1

; zona invisible sobre el widget contraido: abre la lista
[mZonaAbrir]
Meter=Shape
X=0
Y=3
W=180
H=47
Shape=Rectangle 0,0,180,47,10,10 | Fill Color 0,0,0,1 | StrokeWidth 0
ToolTipText=Mostrar lista de temas
LeftMouseUpAction=[!HideMeter mZonaAbrir][!HideMeter mChevron][!HideMeter mSigTxt][!SetVariable Abierto 1][!ShowMeterGroup Lista][!ShowMeter mZonaCerrar][!UpdateMeasure mNTemas][!SetOption mFondo Shape "Rectangle 0,0,180,(108 + [mNTemas] * 15) | Fill Color #Bg# | StrokeWidth 0"][!UpdateMeter mFondo][!Redraw]

; chevron-down (icono del usuario): pista de que la lista se abre, solo contraido
[mChevron]
Meter=Image
X=154
Y=5
W=12
H=12
ImageName=#@#Images\chevron.png
ImageTint=158,168,184
ToolTipText=Mostrar lista de temas

; botones a cada lado (blancos, se tinene de violeta al hover)
[mSigTxt]
Meter=String
MeasureName=mSig
X=148
Y=37
StringAlign=Right
FontFace=#Font#
FontSize=7
FontColor=#Sub#
AntiAlias=1
DynamicVariables=1
ToolTipText=Siguiente tema al pulsar la flecha

[mBtnPrev]
Meter=Image
X=14
Y=18
W=18
H=18
ImageName=#@#Images\prev.png
ImageTint=242,242,242
ToolTipText=Tema anterior (Ctrl+Alt+<-)
ToolTipHidden=1
MouseOverAction=[!SetOption mBtnPrev ImageTint "190,120,255"][!CommandMeasure mTimerPrev "Stop 1"][!CommandMeasure mTimerPrev "Execute 1"]
MouseLeaveAction=[!CommandMeasure mTimerPrev "Stop 1"][!SetOption mBtnPrev ImageTint "242,242,242"][!SetOption mBtnPrev ToolTipHidden 1][!Redraw]
LeftMouseUpAction=["wscript.exe" "#RutaTool#Cambiar.vbs" "-Anterior"]

[mBtnNext]
Meter=Image
X=148
Y=18
W=18
H=18
ImageName=#@#Images\next.png
ImageTint=242,242,242
ToolTipText=Tema siguiente (Ctrl+Alt+->)
ToolTipHidden=1
MouseOverAction=[!SetOption mBtnNext ImageTint "190,120,255"][!CommandMeasure mTimerNext "Stop 1"][!CommandMeasure mTimerNext "Execute 1"]
MouseLeaveAction=[!CommandMeasure mTimerNext "Stop 1"][!SetOption mBtnNext ImageTint "242,242,242"][!SetOption mBtnNext ToolTipHidden 1][!Redraw]
LeftMouseUpAction=["wscript.exe" "#RutaTool#Cambiar.vbs" "-Siguiente"]

; ---------- lista desplegable (clic en el widget para abrir/cerrar) ----------
; cabecera: rueda (clic abre SignalRGB) + reloj + boton agregar
; cabecera de controles del desplegable: azar + rotacion + actualizar
[mBtnAzar]
Meter=Image
X=14
Y=74
W=16
H=16
ImageName=#@#Images\shuffle.png
ImageTint=242,242,242
Group=Lista
Hidden=1
ToolTipText=Aplicar un tema al azar
ToolTipHidden=1
MouseOverAction=[!SetOption mBtnAzar ImageTint "190,120,255"][!CommandMeasure mTimerAzar "Stop 1"][!CommandMeasure mTimerAzar "Execute 1"]
MouseLeaveAction=[!CommandMeasure mTimerAzar "Stop 1"][!SetOption mBtnAzar ImageTint "242,242,242"][!SetOption mBtnAzar ToolTipHidden 1][!Redraw]
LeftMouseUpAction=["wscript.exe" "#RutaTool#Cambiar.vbs" "-Azar"]

[mBtnRotar]
Meter=Image
X=38
Y=74
W=16
H=16
ImageName=#@#Images\alarm.png
DynamicVariables=1
ImageTint=[mColorRot]
Group=Lista
Hidden=1
ToolTipText=Cambiar todos automaticamente: NO, 30 m, 60 m, 180 m, 360 m, 720 m
ToolTipHidden=1
MouseOverAction=[!SetOption mBtnRotar ImageTint "190,120,255"][!CommandMeasure mTimerRotar "Stop 1"][!CommandMeasure mTimerRotar "Execute 1"]
MouseLeaveAction=[!CommandMeasure mTimerRotar "Stop 1"][!SetOption mBtnRotar ImageTint "[mColorRot]"][!SetOption mBtnRotar ToolTipHidden 1][!Redraw]
LeftMouseUpAction=["wscript.exe" "#RutaTool#Cambiar.vbs" "-Rotar"]

[mRotTxt]
Meter=String
MeasureName=mRot
X=60
Y=75
FontFace=#Font#
FontSize=9
FontColor=#Sub#
AntiAlias=1
Group=Lista
Hidden=1
DynamicVariables=1

[mCabAdd]
Meter=Image
X=150
Y=74
W=16
H=16
ImageName=#@#Images\refresh.png
ImageTint=242,242,242
Group=Lista
Hidden=1
ToolTipText=Actualizar lista desde SignalRGB
ToolTipHidden=1
MouseOverAction=[!SetOption mCabAdd ImageTint "190,120,255"][!CommandMeasure mTimerRefresh "Stop 1"][!CommandMeasure mTimerRefresh "Execute 1"]
MouseLeaveAction=[!CommandMeasure mTimerRefresh "Stop 1"][!SetOption mCabAdd ImageTint "242,242,242"][!SetOption mCabAdd ToolTipHidden 1][!Redraw]
LeftMouseUpAction=["wscript.exe" "#RutaTool#Sincronizar.vbs"]

[mRestaTxt]
Meter=String
MeasureName=mRotResta
X=14
Y=37
StringAlign=Left
FontFace=#Font#
FontSize=7
FontColor=#Sub#
AntiAlias=1
DynamicVariables=1
Text=faltan %1 m
Hidden=(1 - ((#Abierto#=1) && ([mRotResta] > 0)))

